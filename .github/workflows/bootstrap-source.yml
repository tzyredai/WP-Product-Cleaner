name: Bootstrap plugin source

on:
  push:
    paths:
      - "dist/wp-product-cleaner-2.1.0.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack release source into repository
        run: |
          rm -rf /tmp/wppc-source
          mkdir -p /tmp/wppc-source
          unzip -q dist/wp-product-cleaner-2.1.0.zip -d /tmp/wppc-source
          rsync -a /tmp/wppc-source/wp-product-cleaner/ ./
          git status --short

      - name: Commit synced plugin source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets includes views wp-product-cleaner.php uninstall.php README.md readme.txt LICENSE
          if git diff --cached --quiet; then
            echo "Source already synced."
            exit 0
          fi
          git commit -m "Sync WP Product Cleaner 2.1.0 source"
          git push
